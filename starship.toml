"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$directory\
$git_branch\
$git_status\
$jobs\
$fill\
$package\
$cmd_duration\
$line_break\
$character
"""

[directory]
style = "bold cyan"
format = "[$path]($style)"
truncation_length = 5
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold purple"
format = " on [$symbol$branch]($style)"

[git_status]
style = "bold yellow"
format = " [\\[ $all_status$ahead_behind\\]]($style)"

conflicted = "=${count} "
stashed = "≡${count} "
deleted = "−${count} "
renamed = "»${count} "
modified = "~${count} "
typechanged = "t${count} "
staged = "+${count} "
untracked = "?${count} "

ahead = "↑${count} "
behind = "↓${count} "
diverged = "↑${ahead_count} ↓${behind_count} "

[jobs]
symbol = "✦ "
style = "bold blue"
format = " [$symbol$number]($style)"
symbol_threshold = 1
number_threshold = 2

[fill]
symbol = " "

[package]
symbol = "󰏗 "
style = "bold white"
format = "[$symbol Package $version]($style)"

[nodejs]
symbol = " "
style = "bold green"
format = " via [$symbol$version]($style)"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = " took [$duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
